[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
markers =
    integration: tests that require browser or external services
    unit: fast tests with no I/O
    requires_chrome: needs a manually-launched Chrome reachable over CDP
