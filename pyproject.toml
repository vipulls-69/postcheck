[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "postcheck"
version = "0.0.1"
description = "Post-completion verification system that exercises LLM-written code in a real browser and reports runtime, network, storage, and UI bugs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Postcheck" }]

dependencies = [
    # Core engine
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "playwright>=1.44,<2",
    "tree-sitter>=0.22,<0.23",
    "tree-sitter-typescript>=0.21,<0.22",
    "tree-sitter-javascript>=0.21,<0.22",
    "tree-sitter-html>=0.20,<0.21",
    "tree-sitter-css>=0.21,<0.22",
    "networkx>=3.3,<4",
    "GitPython>=3.1,<4",
    "anthropic>=0.28,<1",

    # API + persistence
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlmodel>=0.0.19,<0.1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.20,<1",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "celery>=5.4,<6",
    "redis>=5.0,<6",
    "httpx>=0.27,<1",

    # Wrappers
    "mcp>=1.0,<2",
    "typer>=0.12,<1",

    # Observability
    "structlog>=24.1,<25",
    "sentry-sdk>=2.5,<3",
    "cryptography>=42.0,<43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-playwright>=0.5,<1",
    "pytest-cov>=5.0,<6",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
]

[project.scripts]
postcheck = "postcheck.cli.main:main"

[tool.setuptools.packages.find]
include = ["postcheck*"]
exclude = ["tests*", "examples*", "dashboard*"]
