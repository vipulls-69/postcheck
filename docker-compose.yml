services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postcheck
      POSTGRES_PASSWORD: postcheck
      POSTGRES_DB: postcheck
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postcheck"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: python:3.11-slim
    working_dir: /app
    command:
      [
        "sh",
        "-c",
        "echo 'api placeholder — replace with: uvicorn postcheck.api.main:app --host 0.0.0.0 --port 8000' && sleep infinity",
      ]
    environment:
      DATABASE_URL: postgresql+asyncpg://postcheck:postcheck@postgres:5432/postcheck
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: python:3.11-slim
    working_dir: /app
    command:
      [
        "sh",
        "-c",
        "echo 'worker placeholder — replace with: celery -A postcheck.jobs.celery_app worker -l info' && sleep infinity",
      ]
    environment:
      DATABASE_URL: postgresql+asyncpg://postcheck:postcheck@postgres:5432/postcheck
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
